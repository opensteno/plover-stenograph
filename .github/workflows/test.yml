name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.9"
          - os: ubuntu-24.04
            python: "3.13"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.13"
          - os: macos-15
            python: "3.13"
          - os: macos-15-intel
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools and binary dependencies
        run: |
          python -m pip install --only-binary=:all: -r tests/requirements.txt
      - name: Build distributions and install the plugin wheel
        run: |
          python -m build --no-isolation
          python -m pip install --no-deps dist/*.whl
      - name: Test the installed plugin outside the source checkout
        working-directory: ${{ runner.temp }}
        run: python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - name: Verify macOS wheel backend without system libusb
        if: runner.os == 'macOS'
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/tests/smoke_macos_backend.py"
