name: Reading tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Plover's Linux build dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev
      - run: python -m pip install -r tests/reading/requirements.txt
      - run: python -m build --no-isolation
      - name: Install the built wheel
        shell: bash
        run: python -m pip install --no-deps dist/*.whl
      - name: Test outside the source checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        run: python -m unittest discover -s "$GITHUB_WORKSPACE/tests/reading" -v
